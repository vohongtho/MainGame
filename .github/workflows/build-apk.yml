name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Render UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p ui-screenshots
            for screen in HOME CREATE SETTINGS DIAGNOSTICS CALIBRATION MENU; do
              adb shell am force-stop com.example.treedirectiondemo
              adb shell am start -W -n com.example.treedirectiondemo/.UiPreviewActivity --es screen "$screen"
              sleep 1
              adb exec-out screencap -p > "ui-screenshots/${screen}.png"
            done

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tree-navigator-ui-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tree-direction-demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
